services:
  - type: web
    name: skud-pai-sho-server
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pai-sho/shared build && pnpm --filter @pai-sho/server build
    startCommand: pnpm --filter @pai-sho/server start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: skud-pai-sho-db, property: connectionString }
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PLAYER_ONE_USERNAME
        sync: false
      - key: PLAYER_ONE_PASSWORD_HASH
        sync: false
      - key: PLAYER_TWO_USERNAME
        sync: false
      - key: PLAYER_TWO_PASSWORD_HASH
        sync: false
databases:
  - name: skud-pai-sho-db
    plan: starter
